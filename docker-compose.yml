services:
  frontend:
    build: ./frontend
    image: kofanov123/frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    image: containous/whoami

  logger:
    image: busybox
    command: sh -c "while true; do echo \"$(date -Iseconds) event\" >> /data/log.txt; sleep 2; done"
    volumes:
      - logger_data:/data

volumes:
  logger_data: